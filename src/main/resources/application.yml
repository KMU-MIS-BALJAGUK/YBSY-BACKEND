# 공통 설정. 환경별 값은 application-{local,prod}.yml, 비밀 값은 환경변수(.env)로만 받는다.
spring:
  application:
    name: ybsy-backend
  profiles:
    default: local
  config:
    # 프로젝트 루트의 .env(KEY=VALUE)를 읽는다. 없으면 무시. .env 는 커밋 금지.
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)만 바꾼다. JPA 는 엔티티와 테이블이 맞는지 검사만.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    # 쉼표로 구분. 예: http://localhost:5173,https://ybsy.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
