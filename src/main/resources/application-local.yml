# 로컬 개발용. docker-compose.yml 의 MySQL 또는 직접 설치한 MySQL 8 에 연결한다.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ybsy?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ybsy}
    password: ${DB_PASSWORD}
  flyway:
    # 날짜·시간 버전은 머지 순서가 만든 시각과 다를 수 있다.
    # 내 로컬 DB보다 이른 버전의 파일이 나중에 들어와도 실행한다 (db/migration/README.md).
    out-of-order: true
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
