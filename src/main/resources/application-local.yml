# 로컬 개발용. docker-compose.yml 의 MySQL 또는 직접 설치한 MySQL 8 에 연결한다.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ybsy?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ybsy}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
